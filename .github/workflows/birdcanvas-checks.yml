name: BirdCanvas checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q code

      - name: Run regression suite
        env:
          PYTHONPATH: code
        run: python -m unittest discover -s tests -v

      - name: Simulate deployment preflight permissions
        env:
          PYTHONPATH: code
        run: |
          trap 'chmod -R u+w data' EXIT
          chmod -R a-w data
          python -m unittest discover -s tests -v

      - name: Build generated pages
        run: python code/display.py

      - name: Validate deployment shell scripts
        run: |
          for script in deployment/*.sh; do
            bash -n "$script"
          done
