name: BirdCanvas checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q code

      - name: Run regression suite
        env:
          PYTHONPATH: code
        run: python -m unittest discover -s tests -v

      - name: Simulate production preflight sandbox
        run: |
          set -euo pipefail
          SOURCE_DIR="$(mktemp -d)"
          WORK_ROOT="$(mktemp -d)"

          sudo rsync -a --exclude='.git/' ./ "$SOURCE_DIR/"
          sudo chown -R root:root "$SOURCE_DIR"
          sudo chmod -R a-w "$SOURCE_DIR"

          PREFLIGHT_DIR="$(sudo mktemp -d "$WORK_ROOT/preflight.XXXXXX")"
          sudo chown "$(id -u):$(id -g)" "$PREFLIGHT_DIR"
          sudo rsync -a --delete --exclude='.git/' \
            --chown="$(id -u):$(id -g)" \
            "$SOURCE_DIR/" "$PREFLIGHT_DIR/"
          sudo chmod -R u+rwX "$PREFLIGHT_DIR"

          cd "$PREFLIGHT_DIR"
          python -m compileall -q code
          PYTHONPATH=code python -m unittest discover -s tests -v
          python code/display.py

          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)"

      - name: Build generated pages
        run: python code/display.py

      - name: Validate deployment shell scripts
        run: |
          for script in deployment/*.sh; do
            bash -n "$script"
          done
